name = "lumens-ad-factory"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "lumens-ad-factory-assets"
preview_bucket_name = "lumens-ad-factory-assets-dev"

# Runtime bindings are configured at deployment, not entered through Ad Factory.
# Existing Lumens deployment configuration supplies DATABASE_URL and GEMINI_API_KEY.
# NANO_BANANA_MODEL is optional and defaults to gemini-3.1-flash-image.
